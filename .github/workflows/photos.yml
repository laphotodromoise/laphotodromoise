name: Rapatrier les photos Webnode
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.html']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger les photos
        run: python3 telecharger_images.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Photos du site rapatriées depuis Webnode"
          git push
